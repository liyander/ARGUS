name: Nightly showcase

# Re-analyzes the repos in scripts/showcase-repos.json with the same pipeline the
# browser runs, and commits the JSON so the gallery stays fresh.
on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  showcase:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: npm run showcase
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Commit refreshed showcase
        run: |
          git config user.name "stackscope-bot"
          git config user.email "stackscope-bot@users.noreply.github.com"
          git add public/showcase
          git diff --cached --quiet || git commit -m "chore: refresh showcase analyses"
          git push
